    <style>
      /* Critical, inline CSS for the boot splash — must paint before any
         external stylesheet or JS loads, so it can't depend on Tailwind. */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0f1c;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      #boot-splash.boot-splash-hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .boot-splash-glow {
        position: absolute;
        width: 480px;
        height: 480px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(234, 169, 116, 0.16) 0%, rgba(234, 169, 116, 0) 70%);
        animation: bootGlowPulse 2.6s ease-in-out infinite;
      }
      .boot-splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      .boot-splash-logo {
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        font-size: 2.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #ffffff;
        margin: 0;
        animation: bootFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .boot-splash-logo span {
        color: #eaa974;
      }
      .boot-splash-tagline {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #94a3b8;
        animation: bootFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
      }
      .boot-splash-bar {
        width: 140px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        animation: bootFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
      }
      .boot-splash-bar-fill {
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #eaa974, transparent);
        animation: bootBarSweep 1.3s ease-in-out infinite;
      }
      @keyframes bootGlowPulse {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes bootFadeUp {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes bootBarSweep {
        0% { transform: translateX(-150%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-glow, .boot-splash-logo, .boot-splash-tagline, .boot-splash-bar, .boot-splash-bar-fill {
          animation: none !important;
        }
      }
      .boot-splash-error-icon {
        animation: bootFadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .boot-splash-error-title {
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        font-size: 1.3rem;
        font-weight: 800;
        color: #ffffff;
        margin: 0;
        animation: bootFadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
      }
      .boot-splash-error-msg {
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 0.85rem;
        color: #94a3b8;
        max-width: 280px;
        text-align: center;
        line-height: 1.5;
        margin: 0;
        animation: bootFadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
      }
      .boot-splash-retry-btn {
        margin-top: 6px;
        padding: 10px 28px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(180deg, #f3c69a, #eaa974);
        color: #0a0f1c;
        font-family: 'Inter', system-ui, sans-serif;
        font-weight: 800;
        font-size: 0.85rem;
        cursor: pointer;
        box-shadow: 0 8px 20px -6px rgba(234, 169, 116, 0.4);
        transition: transform 0.2s ease;
        animation: bootFadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
      }
      .boot-splash-retry-btn:hover {
        transform: translateY(-1px);
      }
    </style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-splash-glow"></div>
      <div class="boot-splash-content">
        <p class="boot-splash-logo">MOTO<span>RENT</span></p>
        <p class="boot-splash-tagline">Norzagaray · Bulacan</p>
        <div class="boot-splash-bar"><div class="boot-splash-bar-fill"></div></div>
      </div>
    </div>
    <script>
      // Plain, non-module script — runs even if the app bundle below fails
      // to load at all, which is exactly the case (no/dropped connection)
      // this is meant to catch. Swaps the splash to a "no connection" state
      // instead of leaving the loading bar spinning forever.
      (function () {
        var handled = false;

        function showBootSplashError() {
          if (handled) return;
          var splash = document.getElementById('boot-splash');
          if (!splash || splash.classList.contains('boot-splash-hide')) return;
          handled = true;
          var content = splash.querySelector('.boot-splash-content');
          if (!content) return;
          content.innerHTML =
            '<svg class="boot-splash-error-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#eaa974" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
            '<line x1="1" y1="1" x2="23" y2="23"></line>' +
            '<path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>' +
            '<path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>' +
            '<path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>' +
            '<path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>' +
            '<path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>' +
            '<line x1="12" y1="20" x2="12.01" y2="20"></line>' +
            '</svg>' +
            '<p class="boot-splash-error-title">No Connection</p>' +
            '<p class="boot-splash-error-msg">We couldn\'t reach MotoRent. Please check your internet connection and try again.</p>' +
            '<button class="boot-splash-retry-btn" onclick="window.location.reload()">Retry</button>';
        }

        if (!navigator.onLine) showBootSplashError();
        window.addEventListener('offline', showBootSplashError);
        setTimeout(showBootSplashError, 10000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
